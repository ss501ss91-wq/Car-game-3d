<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>سباق السيارات 3D</title>
<style>
:root{--bg:#f4f1ea;--fg:#1f2430;--btn:rgba(30,40,80,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--fg:#e8e9ee;--btn:rgba(70,90,200,.75)}}
:root[data-theme="dark"]{--bg:#14171f;--fg:#e8e9ee;--btn:rgba(70,90,200,.75)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none}
#ctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;direction:ltr}
#ctl .g{display:flex;gap:10px}
#ctl button{width:72px;height:72px;font-size:28px;border:0;border-radius:50%;background:var(--btn);color:#fff;padding:0;touch-action:none}
#ctl button:active{filter:brightness(1.4)}
#mn,#mpb,#cmb{pointer-events:auto;background:rgba(0,0,0,.45);border:0;color:#fff;border-radius:8px;font-size:18px;padding:2px 12px}
#menu{position:absolute;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;gap:10px;padding:16px;background:rgba(10,14,30,.82);color:#fff;border-radius:20px 20px 0 0}
#menu h1{margin:0;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ty{border:2px solid transparent;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:8px 16px;font:inherit;font-weight:700}
.ty.sel{border-color:#5b7cff;background:rgba(91,124,255,.4)}
.cl{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.cl.sel{border-color:#fff}
#info{font-size:13px;opacity:.85}
#sk{background:#2e7d32!important}
#go,#sk{background:#5b7cff;color:#fff;border:0;border-radius:12px;padding:12px 36px;font:inherit;font-weight:700;font-size:17px}
.inmenu #hud,.inmenu #ctl,.inmenu #sp{display:none}
.inmenu #mm,.inmenu #big{display:none!important}
#mm{position:absolute;top:42px;left:8px;width:112px;height:112px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);background:#222;pointer-events:auto}
#big{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.78);color:#fff;z-index:5}
#big canvas{width:min(92vw,72vh);height:min(92vw,72vh);border-radius:12px;border:2px solid #fff}
#sch{position:absolute;top:44px;right:8px;display:none;color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700;pointer-events:none}
.inmenu #sch{display:none!important}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(40,15,0,.4) 100%),linear-gradient(to bottom,rgba(255,150,60,.08),transparent 40%)}
#toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(229,57,53,.92);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#sp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;line-height:1}
#sp svg{width:90px;height:auto;display:block}
#kh{font-size:20px;font-weight:700;margin-top:-6px}
#sp small{font-size:10px;opacity:.85}
@media (max-width:430px){#ctl button{width:60px;height:60px;font-size:24px}}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:16px}
#ov h2{margin:0;font-size:24px}
#ov button{font:inherit;border:0;border-radius:12px;background:#5b7cff;color:#fff;padding:10px 24px;font-weight:700}
</style>
</head>

let mapOpen=false,mapT=0;
function mapDraw(g,W,s,hd,p,fixed){
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,W);
 const co=fixed?1:Math.cos(hd),si=fixed?0:Math.sin(hd),a=-s*co,c=s*si,b=-s*si,d=-s*co,px=fixed?0:p.x,pz=fixed?0:p.z;
 g.setTransform(a,b,c,d,W/2-(a*px+c*pz),W/2-(b*px+d*pz));
 g.drawImage(MS,-200,-200,400,400);
 g.fillStyle='#ffc107';coins.forEach(k=>{g.beginPath();g.arc(k.position.x,k.position.z,fixed?3:4,0,6.3);g.fill();});
 g.fillStyle='#ff5252';bots.forEach(q=>g.fillRect(q.g.position.x-2,q.g.position.z-2,4,4));
 g.setTransform(1,0,0,1,0,0);
 const k=W/240;g.translate(fixed?W/2-s*p.x:W/2,fixed?W/2-s*p.z:W/2);g.rotate(fixed?-hd:0);
 g.beginPath();g.moveTo(0,-9*k);g.lineTo(6*k,7*k);g.lineTo(0,3*k);g.lineTo(-6*k,7*k);g.closePath();g.fillStyle='#4fc3f7';g.fill();g.lineWidth=1.5*k;g.strokeStyle='#fff';g.stroke();
 g.setTransform(1,0,0,1,0,0);
}
